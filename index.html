<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystalic Messenger</title>

<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
}

/* HEADER */
.messenger-header {
    padding: 16px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.messenger-name {
    font-size: 22px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
}

.beta-badge {
    background: #ff6b6b;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 10px;
}

/* USER INFO */
.user-info-cont {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5a5aff, #7a57c7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.user-name {
    font-size: 18px;
    font-weight: 600;
}

.user-status {
    font-size: 13px;
    color: #ff5c5c;
}

/* CHAT */
.mess-cont {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
}

.system-message {
    background: rgba(255,255,255,0.1);
    padding: 10px 16px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 10px;
    color: #ccc;
}

/* INPUT */
.mess-sender-cont {
    padding: 14px;
    background: rgba(0,0,0,0.35);
    border-top: 1px solid rgba(255,255,255,0.1);
}

.input-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
}

.mess-input {
    flex: 1;
    min-height: 48px;
    max-height: 120px;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 14px;
    resize: none;
    outline: none;
}

/* BIG SEND BUTTON */
.send-mess {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: white;
    background: linear-gradient(135deg, #6a6aff, #8b5cf6);
    box-shadow: 0 6px 18px rgba(106,106,255,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.send-mess:active {
    transform: scale(0.92);
    box-shadow: 0 3px 10px rgba(106,106,255,0.3);
}

/* FOOTER */
footer {
    padding: 8px;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="messenger-header">
    <div class="messenger-name">
         Crystalic
        <span class="beta-badge">BETA</span>
    </div>
</div>

<!-- USER -->
<div class="user-info-cont">
    <div class="user-avatar">?</div>
    <div>
        <div class="user-name">@guest</div>
        <div class="user-status">offline</div>
    </div>
</div>

<!-- CHAT -->
<div class="mess-cont">
    <div class="system-message">
        💬 Ласкаво просимо! Використовуйте /help
    </div>
    <div class="system-message">
        📝 Введіть /setusername @name щоб почати
    </div>
</div>

<!-- INPUT -->
<div class="mess-sender-cont">
    <div class="input-wrapper">
        <input class="mess-input" placeholder="Напишіть повідомлення...">
        <button class="send-mess">></button>
    </div>
</div>

<!-- FOOTER -->
<footer>
    © 2026 Crystalic Messenger · By Ruslan
</footer>
<script src="main_script.js" defer></script>
</body>
</html>
